name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -q ".[test]"
      - run: pytest -q
      - name: Check a fresh profile
        run: |
          job-radar init /tmp/profile
          job-radar --home /tmp/profile packs
