[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
dynamic = ["version"]
description = "Find jobs worth applying to on public job boards, scored by rules you write and reviewed by Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11,<2", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.setuptools.dynamic]
version = {attr = "job_radar.__version__"}

[tool.setuptools.packages.find]
include = ["job_radar*"]

[tool.setuptools.package-data]
job_radar = ["packs/*.yaml", "templates/**/*", "skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]   # an unclosed file or a deprecation fails the suite
